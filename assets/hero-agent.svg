<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">douyin-skills</title>
  <desc id="desc">A local-first bridge from agents to the social web, starting with safe, human-reviewed Douyin workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080D"/>
      <stop offset="0.58" stop-color="#10111A"/>
      <stop offset="1" stop-color="#171225"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DE2E6"/>
      <stop offset="0.52" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#FF3B78"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(1040 102) rotate(123) scale(390 330)">
      <stop offset="0" stop-color="#2DE2E6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DE2E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="0" cy="0" r="1" gradientTransform="translate(1070 556) rotate(-125) scale(380 300)">
      <stop offset="0" stop-color="#FF3B78" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF3B78" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="32" fill="url(#grid)"/>
  <rect width="1280" height="640" rx="32" fill="url(#cyanGlow)"/>
  <rect width="1280" height="640" rx="32" fill="url(#pinkGlow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <g transform="translate(72 68)">
      <rect width="270" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <circle cx="19" cy="17" r="5" fill="#2DE2E6"/>
      <text x="34" y="22" fill="#D5D7E2" font-size="13" font-weight="700" letter-spacing="1.4">LOCAL-FIRST AGENT TOOLKIT</text>
    </g>

    <text x="72" y="202" fill="#F8F9FD" font-size="78" font-weight="760" letter-spacing="-3">douyin-skills</text>
    <rect x="74" y="226" width="116" height="7" rx="3.5" fill="#2DE2E6"/>
    <rect x="188" y="226" width="68" height="7" rx="3.5" fill="#7C5CFC"/>
    <rect x="254" y="226" width="38" height="7" rx="3.5" fill="#FF3B78"/>

    <text x="72" y="285" fill="#F2F3F8" font-size="32" font-weight="650" letter-spacing="0">A practical bridge from agents</text>
    <text x="72" y="325" fill="#F2F3F8" font-size="32" font-weight="650" letter-spacing="0">to the social web</text>
    <text x="72" y="363" fill="#A9ADBC" font-size="16" font-weight="450">Starting with Douyin · local Chrome · human checkpoints</text>

    <g transform="translate(72 412)">
      <rect width="472" height="94" rx="20" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <g transform="translate(24 23)">
