        <text x="0" y="15" fill="#7F8494" font-size="12" font-weight="700" letter-spacing="1.4">REUSABLE AGENT LOOP</text>

        <path d="M219 64 C219 95 219 109 219 132 M219 132 C219 159 69 147 69 182 M219 132 C219 159 219 182 219 182 M219 132 C219 159 369 147 369 182" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
        <circle cx="219" cy="63" r="36" fill="#11131B" stroke="url(#accent)" stroke-width="2.5"/>
        <path d="M207 64h24M219 52v24" stroke="#F8F9FD" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="219" cy="63" r="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

        <g transform="translate(0 182)">
          <rect width="138" height="66" rx="16" fill="#20232E" stroke="#2DE2E6" stroke-opacity="0.36"/>
          <circle cx="21" cy="24" r="7" fill="#2DE2E6"/>
          <text x="38" y="29" fill="#F1F3F8" font-size="16" font-weight="700">Skill</text>
          <text x="12" y="51" fill="#858A99" font-size="10">Intent · Context</text>
        </g>
        <g transform="translate(150 182)">
          <rect width="138" height="66" rx="16" fill="#20232E" stroke="#7C5CFC" stroke-opacity="0.38"/>
          <circle cx="21" cy="24" r="7" fill="#7C5CFC"/>
          <text x="38" y="29" fill="#F1F3F8" font-size="16" font-weight="700">CLI</text>
          <text x="12" y="51" fill="#858A99" font-size="10">JSON · Timeouts</text>
        </g>
        <g transform="translate(300 182)">
          <rect width="138" height="66" rx="16" fill="#20232E" stroke="#FF3B78" stroke-opacity="0.38"/>
          <circle cx="21" cy="24" r="7" fill="#FF3B78"/>
          <text x="38" y="29" fill="#F1F3F8" font-size="16" font-weight="700">Adapter</text>
          <text x="12" y="51" fill="#858A99" font-size="10">Browser · Platform</text>
        </g>

        <g transform="translate(68 273)">
          <rect width="143" height="66" rx="16" fill="#20232E" stroke="#FFFFFF" stroke-opacity="0.15"/>
          <circle cx="21" cy="24" r="7" fill="#E6E8EF"/>
          <text x="38" y="29" fill="#F1F3F8" font-size="16" font-weight="700">Review</text>
          <text x="14" y="51" fill="#858A99" font-size="10">Human · Confirm</text>
        </g>
        <g transform="translate(227 273)">
          <rect width="143" height="66" rx="16" fill="#20232E" stroke="#FFFFFF" stroke-opacity="0.15"/>
          <circle cx="21" cy="24" r="7" fill="#E6E8EF"/>
          <text x="38" y="29" fill="#F1F3F8" font-size="16" font-weight="700">State</text>
          <text x="14" y="51" fill="#858A99" font-size="10">Known · Unknown</text>
        </g>

        <rect x="49" y="377" width="340" height="44" rx="14" fill="#0E1017" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <circle cx="72" cy="399" r="5" fill="#52D48A"/>
        <text x="78" y="404" fill="#B3B7C4" font-size="12" font-weight="600">Intent → Skill → CLI → Adapter → Platform</text>
