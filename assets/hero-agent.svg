        <path d="M15 24.5l6 6 12-14" fill="none" stroke="#2DE2E6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="88" y="39" fill="#F2F3F8" font-size="17" font-weight="700">Guardrails for real-world actions</text>
      <text x="88" y="66" fill="#989CAB" font-size="13">Local sessions · human checks · honest result states</text>
    </g>

    <text x="72" y="568" fill="#727786" font-size="12" font-weight="650" letter-spacing="0.55">AGENT SKILLS  ·  JSON CLI  ·  CHROME CDP  ·  HUMAN-IN-THE-LOOP</text>

    <g transform="translate(684 72)" filter="url(#softShadow)">
      <rect width="524" height="496" rx="28" fill="#171923" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <rect x="1" y="1" width="522" height="54" rx="27" fill="#20222E"/>
      <path d="M1 54h522" stroke="#FFFFFF" stroke-opacity="0.08"/>
