name: Bug 报告
description: 报告可复现的运行错误或页面兼容问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除 Cookie、手机号、验证码、二维码和本地 Profile 路径等敏感信息。
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 实际发生了什么？你原本期待什么结果？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行命令……
        2. 页面进入……
        3. 出现错误……
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: 使用的 CLI 子命令
      placeholder: python scripts/cli.py check-login
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、Node.js、Chrome 版本，以及 doctor 的脱敏结果。
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 脱敏后的 JSON 或日志
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除 Cookie、手机号、验证码、二维码和本地 Profile 数据。
          required: true
