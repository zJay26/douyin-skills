name: Bug report
description: Report a reproducible runtime error or page-compatibility problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Remove cookies, phone numbers, verification codes, QR codes, and local profile paths before posting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run command...
        2. Reach page...
        3. Observe error...
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: CLI command
      placeholder: python scripts/cli.py check-login
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, Node.js, Chrome, and sanitized doctor output.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized JSON or logs
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed cookies, phone numbers, verification codes, QR codes, and local profile data.
          required: true
