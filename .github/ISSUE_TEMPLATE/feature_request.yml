name: Feature request
description: Propose a clear, responsible improvement to the local agent workflow
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What real workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should the Skill or CLI behave?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation path
      description: How could a maintainer test this without exposing account data?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety boundaries
      options:
        - label: This proposal does not depend on bypassing captcha, risk controls, or platform limits.
          required: true
        - label: This proposal is not intended for engagement inflation, account farming, or unauthorized actions.
          required: true
