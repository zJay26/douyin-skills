name: 功能建议
description: 提议一个清晰、合规且适合本地自动化的改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你正在解决什么实际问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望 Skill 或 CLI 如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你尝试过的替代方案
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 该建议不依赖绕过验证码、风控或平台限制。
          required: true
        - label: 该建议不用于批量刷量、养号或未经授权的账号操作。
          required: true
